<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 142 110" width="142" height="110">
  <!-- Showroom Water Target / A Granel 24-7 (Av. Patria 2110) en estilo 3D para el marcador del mapa -->
  <defs>
    <pattern id="slats" width="4" height="10" patternUnits="userSpaceOnUse">
      <rect width="4" height="10" fill="#8f5d3f"/><rect width="1.5" height="10" fill="#653b26"/>
    </pattern>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8cff"/><stop offset="1" stop-color="#0155ed"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c5f86"/><stop offset=".55" stop-color="#1d3550"/><stop offset="1" stop-color="#2d4f73"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f4"/><stop offset="1" stop-color="#cfd5dc"/>
    </linearGradient>
  </defs>
  <ellipse cx="70" cy="104" rx="46" ry="5" fill="#000" opacity=".22"/>
  <!-- techo y costado (profundidad) -->
  <polygon points="8,30 22,21 134,21 120,30" fill="#a8775a"/>
  <polygon points="120,30 134,21 134,80 120,89" fill="#5a3522"/>
  <polygon points="120,58 134,49 134,80 120,89" fill="#aab2bb"/>
  <!-- fachada de listones -->
  <rect x="8" y="30" width="112" height="28" fill="url(#slats)"/>
  <rect x="8" y="30" width="112" height="28" fill="url(#shade)"/>
  <!-- logos pequeños de la fachada -->
  <rect x="12" y="38" width="10" height="7" rx="1" fill="#fff"/>
  <rect x="25" y="38" width="9" height="7" rx="1" fill="#fff"/>
  <circle cx="39" cy="41.5" r="4.2" fill="#fff"/><circle cx="39" cy="41.5" r="3" fill="#fc5f13"/>
  <rect x="90" y="39" width="9" height="5" rx="1" fill="#fff"/>
  <rect x="101" y="39" width="8" height="5" rx="1" fill="#fff"/>
  <rect x="111" y="39" width="7" height="5" rx="1" fill="#fff"/>
  <!-- planta baja con vitrinas -->
  <rect x="8" y="58" width="112" height="31" fill="url(#wall)"/>
  <g fill="url(#glass)" stroke="#fff" stroke-width="1">
    <rect x="12" y="62" width="12" height="23"/>
    <rect x="27" y="62" width="27" height="23"/>
    <rect x="73" y="62" width="25" height="23"/>
    <rect x="101" y="62" width="15" height="23"/>
  </g>
  <rect x="58" y="62" width="12" height="23" fill="#dfe8f1" stroke="#fff" stroke-width="1"/>
  <line x1="64" y1="62" x2="64" y2="85" stroke="#9fb0c2" stroke-width=".8"/>
  <!-- equipos azules detrás del vidrio -->
  <rect x="30" y="68" width="5" height="17" rx="1" fill="#1e7bf0"/>
  <rect x="44" y="70" width="5" height="15" rx="1" fill="#1e7bf0"/>
  <rect x="77" y="70" width="6" height="15" rx="2" fill="#7fb7a8"/>
  <rect x="86" y="69" width="6" height="16" rx="2" fill="#2f8cff"/>
  <!-- banqueta amarilla -->
  <rect x="5" y="89" width="117" height="3.5" fill="#f5c400"/>
  <!-- letrero WATER TARGET -->
  <polygon points="84,23 88,20 88,48 84,51" fill="#003fb0"/>
  <rect x="42" y="23" width="42" height="28" rx="1.5" fill="url(#sign)"/>
  <text x="63" y="35.5" text-anchor="middle" font-family="Rubik, Arial, sans-serif" font-size="9" font-weight="800" fill="#fff">WATER</text>
  <text x="63" y="45" text-anchor="middle" font-family="Rubik, Arial, sans-serif" font-size="9" font-weight="800" fill="#bfe0ff">TARGET</text>
  <!-- punta del marcador -->
  <polygon points="61,92.5 79,92.5 70,105" fill="#073fa1" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
